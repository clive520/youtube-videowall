<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電視牆 4 分割播放清單</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 2x2 四等份電視牆網格 */
    .wall-grid {
      display: grid;
      grid-template-columns: 50vw 50vw;
      grid-template-rows: 50vh 50vh;
      width: 100vw;
      height: 100vh;
      background-color: #000;
    }

    .wall-quadrant {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .wall-quadrant iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 懸浮控制工具列 (滑鼠移動時顯示，閒置 3 秒自動隱藏) */
    .control-bar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 10px;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .control-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.04);
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* 螢幕頂部細微狀態指示標籤 */
    .status-badge {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: rgba(255, 255, 255, 0.7);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      letter-spacing: 0.5px;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    body.show-hint .status-badge {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="status-badge" id="statusBadge">電視牆模式 4 分割 (已靜音自動播放)</div>

  <!-- 2x2 四等份網格 -->
  <main class="wall-grid">
    <!-- 格位 1 (左上) -->
    <div class="wall-quadrant">
      <iframe 
        id="player1"
        src="https://www.youtube.com/embed/videoseries?si=V_aEFbLvPOkwgbQ_&list=PLAFdajbNY8qg&autoplay=1&mute=1&loop=1&playsinline=1&enablejsapi=1&rel=0"
        title="播放清單 1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <!-- 格位 2 (右上) -->
    <div class="wall-quadrant">
      <iframe 
        id="player2"
        src="https://www.youtube.com/embed/videoseries?si=a99uBJPiEJ4Cs2wA&list=PLb-1Ato1hBHU&autoplay=1&mute=1&loop=1&playsinline=1&enablejsapi=1&rel=0"
        title="播放清單 2"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <!-- 格位 3 (左下) -->
    <div class="wall-quadrant">
      <iframe 
        id="player3"
        src="https://www.youtube.com/embed/videoseries?si=0oNKZphrSdOHiyff&list=PLcWWFOjqgw0Y&autoplay=1&mute=1&loop=1&playsinline=1&enablejsapi=1&rel=0"
        title="播放清單 3"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <!-- 格位 4 (右下) -->
    <div class="wall-quadrant">
      <iframe 
        id="player4"
        src="https://www.youtube.com/embed/videoseries?si=9skt6DdHQQyRQ-9W&list=PLAMJFFj4p-TQ_7R9OAnRkJ9WvVrvKqJ68&autoplay=1&mute=1&loop=1&playsinline=1&enablejsapi=1&rel=0"
        title="播放清單 4"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <!-- 懸浮控制工具列 (滑鼠晃動時顯示) -->
  <nav class="control-bar" id="controlBar">
    <button class="ctrl-btn" id="playAllBtn" title="全部播放">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      全部播放
    </button>
    <button class="ctrl-btn" id="pauseAllBtn" title="全部暫停">
      <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      全部暫停
    </button>
    <button class="ctrl-btn" id="muteToggleBtn" title="聲音切換">
      <svg id="muteIcon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      <span id="muteText">已靜音</span>
    </button>
    <button class="ctrl-btn" id="fullscreenBtn" title="全螢幕切換">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      全螢幕
    </button>
  </nav>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const playerIds = ['player1', 'player2', 'player3', 'player4'];
    const players = {};
    let isMuted = true;

    // YouTube API 載入完成回呼
    function onYouTubeIframeAPIReady() {
      playerIds.forEach(id => {
        players[id] = new YT.Player(id, {
          events: {
            'onReady': onPlayerReady
          }
        });
      });
    }

    function onPlayerReady(event) {
      // 確保靜音並播放
      event.target.mute();
      event.target.playVideo();
    }

    // 控制工具列自動隱藏邏輯
    const controlBar = document.getElementById('controlBar');
    let hideTimer = null;

    function showControls() {
      controlBar.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        controlBar.classList.remove('visible');
      }, 3500);
    }

    window.addEventListener('mousemove', showControls);
    window.addEventListener('touchstart', showControls);

    // 啟動時計時顯示提示標籤
    document.body.classList.add('show-hint');
    setTimeout(() => {
      document.body.classList.remove('show-hint');
    }, 4000);

    // 控制按鈕功能
    document.getElementById('playAllBtn').addEventListener('click', () => {
      Object.values(players).forEach(p => {
        if (p && typeof p.playVideo === 'function') {
          p.playVideo();
        }
      });
    });

    document.getElementById('pauseAllBtn').addEventListener('click', () => {
      Object.values(players).forEach(p => {
        if (p && typeof p.pauseVideo === 'function') {
          p.pauseVideo();
        }
      });
    });

    const muteToggleBtn = document.getElementById('muteToggleBtn');
    const muteText = document.getElementById('muteText');
    muteToggleBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      Object.values(players).forEach(p => {
        if (p) {
          if (isMuted && typeof p.mute === 'function') {
            p.mute();
          } else if (!isMuted && typeof p.unMute === 'function') {
            p.unMute();
          }
        }
      });
      muteText.textContent = isMuted ? '已靜音' : '已開音量';
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen request error:", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // 瀏覽器點擊解鎖安全播放機制 (某些瀏覽器阻止未互動頁面自動播放)
    document.addEventListener('click', () => {
      Object.values(players).forEach(p => {
        if (p && typeof p.getPlayerState === 'function') {
          // 若尚未播放，觸發播放
          if (p.getPlayerState() !== YT.PlayerState.PLAYING) {
            p.playVideo();
          }
        }
      });
    }, { once: true });
  </script>
</body>
</html>
